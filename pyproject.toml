[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arch-runtime"
dynamic = ["version"]
description = "Application and persistence runtime for ARch contract-driven systems."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "ARch Runtime Maintainers" },
]
keywords = ["architecture", "contracts", "runtime", "persistence"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "arch-kernel>=0.1.0,<0.2.0",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "packaging>=24",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
  "twine>=6.0",
]

[tool.uv.sources]
arch-kernel = { git = "https://github.com/erikmktdig-cell/ARCH-kernel.git", tag = "v0.1.0" }

[tool.hatch.version]
path = "src/arch_runtime/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_runtime"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--basetemp=.pytest-tmp",
  "--cov=arch_runtime",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
markers = [
  "unit: focused package tests",
  "contract: reusable behavioral tests for port adapters",
  "sqlite: SQLite connection, schema, and migration foundation tests",
  "architecture: import boundaries and bootstrap scope tests",
  "release: distribution and installation tests",
]

[tool.coverage.run]
branch = true
source = ["src/arch_runtime"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PT", "PTH", "RUF", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/arch_runtime", "tests"]
warn_unused_configs = true
show_error_codes = true
pretty = true
